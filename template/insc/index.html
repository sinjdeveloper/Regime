<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="insc-global.css">
  <link rel="stylesheet" href="signup.css">
  
</head>

<body>
  <section id="section-signup" class="signup-section">
    <div class="signup-left">
      <div class="brand-content">
        <h1 class="brand-title">
          <span>Vary</span>
          <span class="highlight">'</span>
          <span>Ena</span>
        </h1>
        <p class="brand-subtitle">Rejoignez notre communauté et atteignez vos objectifs de santé</p>
      </div>
    </div>
    <div class="signup-right">
      <div class="signup-card-wrapper">
        <div class="signup-card">
          <div class="card-header">
            <div class="merged-logo">
              <!--merged image-->
              <img src="images/33_33.svg" class="logo-part" style="left: 1px; top: 1px; width: 38px; height: 38px;"
                alt="">
              <img src="images/33_36.svg" class="logo-part" style="left: 15px; top: 16.5px; width: 8px; height: 13.5px;"
                alt="">
              <img src="images/33_40.svg" class="logo-part" style="left: 16px; top: 12px; width: 3px; height: 5px;"
                alt="">
              <img src="images/33_43.svg" class="logo-part"
                style="left: 24px; top: 11.5px; width: 3.75px; height: 4.625px;" alt="">
              <img src="images/33_46.svg" class="logo-part" style="left: 13px; top: 25px; width: 2px; height: 2px;"
                alt="">
              <img src="images/33_49.svg" class="logo-part" style="left: 19px; top: 22px; width: 2px; height: 2px;"
                alt="">
              <img src="images/33_52.svg" class="logo-part" style="left: 25px; top: 20.5px; width: 2px; height: 2px;"
                alt="">
            </div>
            <h2 class="card-brand">
              <span>Vary</span>
              <span class="highlight">'</span>
              <span>Ena</span>
            </h2>
          </div>
          <div class="card-body">
            <h3 class="form-title">Créer un compte</h3>
            <form class="signup-form">
              <div class="form-row split">
                <div class="form-group">
                  <label>Prénom</label>
                  <div class="input-wrapper">
                    <img src="images/33_72.svg" class="input-icon" alt="user icon">
                    <input type="text" placeholder="Jean">
                  </div>
                </div>
                <div class="form-group">
                  <label>Nom</label>
                  <div class="input-wrapper">
                    <img src="images/33_82.svg" class="input-icon" alt="user icon">
                    <input type="text" placeholder="Dupont">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                  <img src="images/33_92.svg" class="input-icon" alt="email icon">
                  <input type="email" placeholder="jean.dupont@email.com">
                </div>
              </div>
              <div class="form-group">
                <label>Genre</label>
                <div class="input-wrapper select-wrapper">
                  <select>
                    <option value="" disabled selected></option>
                    <option value="homme">Homme</option>
                    <option value="femme">Femme</option>
                    <option value="autre">Autre</option>
                  </select>
                  <img src="images/33_101.svg" class="select-icon" alt="dropdown arrow">
                </div>
              </div>
              <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrapper">
                  <img src="images/33_110.svg" class="input-icon" alt="lock icon">
                  <input type="password" placeholder="••••••••">
                  <img src="images/33_114.svg" class="input-icon-right" alt="toggle visibility">
                </div>
              </div>
              <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <div class="input-wrapper">
                  <img src="images/33_124.svg" class="input-icon" alt="lock icon">
                  <input type="password" placeholder="••••••••">
                  <img src="images/33_128.svg" class="input-icon-right" alt="toggle visibility">
                </div>
              </div>
              <button type="button" class="submit-btn">S'inscrire</button>
            </form>
            <div class="login-link">
              <span class="text-gray">Vous avez déjà un compte? </span>
              <a href="#">Se connecter</a>
            </div>
          </div>
        </div>
        <div class="footer-copy">
          © 2026 Vary'Ena. All rights reserved.
        </div>
      </div>
    </div>
  </section>
</body>

</html>
