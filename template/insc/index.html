<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Signup */
.signup-section {
  display: flex;
  min-height: 100vh;
  width: 100%;
  max-width: 1494px;
  margin: 0 auto;
  background-color: #ffffff;
}

.signup-left {
  flex: 1;
  background: linear-gradient(rgba(102, 51, 102, 0.83), rgba(102, 51, 102, 0.83)), url('images/c7860d66b83eb9d06c543aa34ea9bc9aa4727194.png') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
}

.brand-content {
  text-align: center;
  color: #ffffff;
  max-width: 448px;
}

.brand-title {
  font-size: 58px;
  font-weight: 700;
  margin: 0 0 16px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.brand-subtitle {
  font-size: 18px;
  line-height: 1.5;
  margin: 0;
  color: rgba(255, 255, 255, 0.9);
}

.highlight {
  color: #ffb900;
}

.signup-right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  background-color: #e2e2e2;
}

.signup-card-wrapper {
  width: 100%;
  max-width: 448px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.signup-card {
  background-color: #ffffff;
  border-radius: 20px;
  box-shadow: 0px 8px 32px 0px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}

.card-header {
  background-color: #663366;
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 152px;
  gap: 16px;
}

.merged-logo {
  position: relative;
  width: 40px;
  height: 40px;
}

.logo-part {
  position: absolute;
}

.card-brand {
  color: #ffffff;
  font-size: 32px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 2px;
}

.card-body {
  padding: 32px;
}

.form-title {
  font-size: 24px;
  font-weight: 700;
  color: #000000;
  text-align: center;
  margin: 0 0 32px 0;
}

.signup-form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.form-row.split {
  display: flex;
  gap: 16px;
}

.form-row.split .form-group {
  flex: 1;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-size: 14px;
  color: #000000;
  font-weight: 500;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  height: 51px;
  border: 1px solid rgba(0, 0, 0, 0.29);
  border-radius: 10px;
  background-color: transparent;
  box-shadow: 0px 1px 4px 0px rgba(0, 0, 0, 0.25);
}

.input-wrapper input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  padding: 0 48px;
  font-size: 14px;
  color: #000000;
  outline: none;
  font-family: inherit;
}

.input-wrapper input::placeholder {
  color: rgba(0, 0, 0, 0.27);
}

.input-icon {
  position: absolute;
  left: 16px;
  width: 18px;
  height: 18px;
  pointer-events: none;
}

.input-icon-right {
  position: absolute;
  right: 16px;
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.select-wrapper {
  padding: 0;
  border: 1px solid rgba(101, 101, 152, 0.98);
}

.select-wrapper select {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  padding: 0 48px 0 16px;
  font-size: 14px;
  color: #000000;
  outline: none;
  appearance: none;
  font-family: inherit;
  cursor: pointer;
}

.select-icon {
  position: absolute;
  right: 16px;
  width: 18px;
  height: 18px;
  pointer-events: none;
}

.submit-btn {
  height: 44px;
  background-color: #99a1af;
  color: #ffffff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0px 2px 4px 0px rgba(0, 0, 0, 0.1), 0px 4px 6px 0px rgba(0, 0, 0, 0.1);
  transition: background-color 0.2s ease;
  font-family: inherit;
  margin-top: 8px;
}

.submit-btn:hover {
  background-color: #8a92a0;
}

.login-link {
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
}

.text-gray {
  color: #4a5565;
}

.login-link a {
  color: #666699;
  text-decoration: none;
  font-weight: 600;
}

.login-link a:hover {
  text-decoration: underline;
}

.footer-copy {
  text-align: center;
  color: #6a7282;
  font-size: 12px;
}

@media (max-width: 992px) {
  .signup-section {
    flex-direction: column;
  }
  
  .signup-left {
    min-height: 400px;
    flex: none;
  }
  
  .signup-right {
    padding: 48px 16px;
  }
}

@media (max-width: 480px) {
  .form-row.split {
    flex-direction: column;
    gap: 24px;
  }
  
  .brand-title {
    font-size: 42px;
  }
  
  .card-body {
    padding: 24px 16px;
  }
}
  </style>
</head>
<body>
<section id="section-signup" class="signup-section">
  <div class="signup-left">
    <div class="brand-content">
      <h1 class="brand-title">
        <span>Vary</span>
        <span class="highlight">'</span>
        <span>Ena</span>
      </h1>
      <p class="brand-subtitle">Rejoignez notre communauté et atteignez vos objectifs de santé</p>
    </div>
  </div>
  <div class="signup-right">
    <div class="signup-card-wrapper">
      <div class="signup-card">
        <div class="card-header">
          <div class="merged-logo">
            <!--merged image-->
            <img src="images/33_33.svg" class="logo-part" style="left: 1px; top: 1px; width: 38px; height: 38px;" alt="">
            <img src="images/33_36.svg" class="logo-part" style="left: 15px; top: 16.5px; width: 8px; height: 13.5px;" alt="">
            <img src="images/33_40.svg" class="logo-part" style="left: 16px; top: 12px; width: 3px; height: 5px;" alt="">
            <img src="images/33_43.svg" class="logo-part" style="left: 24px; top: 11.5px; width: 3.75px; height: 4.625px;" alt="">
            <img src="images/33_46.svg" class="logo-part" style="left: 13px; top: 25px; width: 2px; height: 2px;" alt="">
            <img src="images/33_49.svg" class="logo-part" style="left: 19px; top: 22px; width: 2px; height: 2px;" alt="">
            <img src="images/33_52.svg" class="logo-part" style="left: 25px; top: 20.5px; width: 2px; height: 2px;" alt="">
          </div>
          <h2 class="card-brand">
            <span>Vary</span>
            <span class="highlight">'</span>
            <span>Ena</span>
          </h2>
        </div>
        <div class="card-body">
          <h3 class="form-title">Créer un compte</h3>
          <form class="signup-form">
            <div class="form-row split">
              <div class="form-group">
                <label>Prénom</label>
                <div class="input-wrapper">
                  <img src="images/33_72.svg" class="input-icon" alt="user icon">
                  <input type="text" placeholder="Jean">
                </div>
              </div>
              <div class="form-group">
                <label>Nom</label>
                <div class="input-wrapper">
                  <img src="images/33_82.svg" class="input-icon" alt="user icon">
                  <input type="text" placeholder="Dupont">
                </div>
              </div>
            </div>
            <div class="form-group">
              <label>Email</label>
              <div class="input-wrapper">
                <img src="images/33_92.svg" class="input-icon" alt="email icon">
                <input type="email" placeholder="jean.dupont@email.com">
              </div>
            </div>
            <div class="form-group">
              <label>Genre</label>
              <div class="input-wrapper select-wrapper">
                <select>
                  <option value="" disabled selected></option>
                  <option value="homme">Homme</option>
                  <option value="femme">Femme</option>
                  <option value="autre">Autre</option>
                </select>
                <img src="images/33_101.svg" class="select-icon" alt="dropdown arrow">
              </div>
            </div>
            <div class="form-group">
              <label>Mot de passe</label>
              <div class="input-wrapper">
                <img src="images/33_110.svg" class="input-icon" alt="lock icon">
                <input type="password" placeholder="••••••••">
                <img src="images/33_114.svg" class="input-icon-right" alt="toggle visibility">
              </div>
            </div>
            <div class="form-group">
              <label>Confirmer le mot de passe</label>
              <div class="input-wrapper">
                <img src="images/33_124.svg" class="input-icon" alt="lock icon">
                <input type="password" placeholder="••••••••">
                <img src="images/33_128.svg" class="input-icon-right" alt="toggle visibility">
              </div>
            </div>
            <button type="button" class="submit-btn">S'inscrire</button>
          </form>
          <div class="login-link">
            <span class="text-gray">Vous avez déjà un compte? </span>
            <a href="#">Se connecter</a>
          </div>
        </div>
      </div>
      <div class="footer-copy">
        © 2026 Vary'Ena. All rights reserved.
      </div>
    </div>
  </div>
</section>
</body>
