<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Selection</title>
  <link rel="stylesheet" href="insc-goal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <section id="registration-section">
    <div class="split-layout">

      <!-- LEFT -->
      <div class="left-panel">
        <div class="left-content">
          <h1 class="logo-large">
            <span class="text-white">Vary</span>
            <span class="text-yellow">'</span>
            <span class="text-white">Ena</span>
          </h1>
          <p class="subtitle">Rejoignez notre communauté et atteignez vos objectifs</p>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right-panel">
        <div class="registration-card">

          <!-- HEADER -->
          <div class="card-header">
            <div class="logo-small">
              <span class="text-white">Vary</span>
              <span class="text-yellow">'</span>
              <span class="text-white">Ena</span>
            </div>
          </div>

          <!-- BODY -->
          <div class="card-body">

            <div class="pagination">
              <span class="dot active"></span>
              <span class="dot"></span>
            </div>

            <h2 class="form-title">Choisissez vos objectifs</h2>
            <p class="form-subtitle">Sélectionnez jusqu’à 3 objectifs</p>

            <div class="options-list">

              <label class="goal-option">
                <img src="images/76_594.svg" class="option-icon">
                <span class="option-text">Augmenter son poids</span>
                <input type="checkbox" class="hidden-checkbox">
                <span class="custom-checkbox"><span class="checkbox-inner"></span></span>
              </label>

              <label class="goal-option">
                <img src="images/76_602.svg" class="option-icon">
                <span class="option-text">Réduire son poids</span>
                <input type="checkbox" class="hidden-checkbox">
                <span class="custom-checkbox"><span class="checkbox-inner"></span></span>
              </label>

              <label class="goal-option">
                <img src="images/76_611.svg" class="option-icon">
                <span class="option-text">IMC idéal</span>
                <input type="checkbox" class="hidden-checkbox">
                <span class="custom-checkbox"><span class="checkbox-inner"></span></span>
              </label>

              <label class="goal-option">
                <img src="images/76_619.svg" class="option-icon">
                <span class="option-text">Régimes suggérés</span>
                <input type="checkbox" class="hidden-checkbox">
                <span class="custom-checkbox"><span class="checkbox-inner"></span></span>
              </label>

            </div>

            <button class="btn-primary">Créer Compte</button>

          </div>
        </div>
      </div>

    </div>
  </section>

</body>

</html>
